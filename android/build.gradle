def packageJson = new groovy.json.JsonSlurper().parse(file("$projectDir/../package.json"))

buildscript {
    ext.kotlin_version = rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '2.0.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdkVersion 34
    namespace "io.conekta.rn"

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Conekta Elements with Compose UI
    implementation "io.conekta:conekta-elements-compose:${packageJson.conektaElements.androidVersion}"

    // React Native
    implementation "com.facebook.react:react-android"

    // Compose BOM
    implementation platform("androidx.compose:compose-bom:2024.02.00")
    implementation "androidx.compose.runtime:runtime"
}
